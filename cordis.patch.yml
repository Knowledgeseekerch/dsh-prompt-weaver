- insert:
    - id: prompt-weaver
      name: 'dsh-prompt-weaver'
      config:
        mode: standard
        defaultFramework: auto
        maxDraftChars: 20000
        maxResultChars: 40000
        maxOutputTokens: 2000
        timeoutMs: 45000
        temperature: 0.2
        maxIterations: 5
        includeAssistantMessages: false
        maxConversationMessages: 12
        maxConversationChars: 8000
        context:
          enabled: true
          maxFiles: 10
          maxFileBytes: 16384
          maxTotalBytes: 98304
          maxTreeEntries: 160
          maxScanDirs: 600
          maxIndexFiles: 10000
          maxIndexSources: 1200
          maxIndexedFileBytes: 262144
          maxDepth: 7
        privacy:
          redactSecrets: true
          blockSensitiveDraft: true
          maxRedactions: 200
        persistFrameworks: false
