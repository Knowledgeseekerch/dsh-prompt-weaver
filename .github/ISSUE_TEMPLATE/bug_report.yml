name: Bug report
description: Report a reproducible functional, privacy, or quality-gate bug.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command or UI path. Do not paste real secrets or private project content.
      placeholder: |
        1. Run `node bin/dsh-prompt-weaver.js ...`
        2. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste redacted output, logs, or failing test output.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.19.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core engine
        - CLI
        - Host service
        - Web composer UI
        - Frameworks/import-export
        - Privacy/security
        - Documentation
    validations:
      required: true
